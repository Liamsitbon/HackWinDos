name: AppleDockChannel ARM64 WDK

on:
  push:
    paths:
      - '.github/workflows/apple-dockchannel-wdk.yml'
      - 'Directory.Build.props'
      - 'packages.config'
      - 'drivers/apple-dockchannel/**'
  pull_request:
    paths:
      - '.github/workflows/apple-dockchannel-wdk.yml'
      - 'Directory.Build.props'
      - 'packages.config'
      - 'drivers/apple-dockchannel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - uses: NuGet/setup-nuget@v2
      - name: Restore official SDK and WDK
        run: nuget restore drivers/apple-dockchannel/windows/packages.config -PackagesDirectory packages
      - name: Expose WDK host tools
        shell: pwsh
        run: |
          $stamp = Get-ChildItem packages -Recurse -Filter stampinf.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (!$stamp) { throw 'WDK stampinf.exe is missing' }
          $stamp.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the experimental KMDF adapter
        run: >-
          msbuild drivers\apple-dockchannel\windows\AppleDockChannel.vcxproj
          /m /t:Clean,Build /p:Configuration=Debug /p:Platform=ARM64
          /p:RunCodeAnalysis=true
      - name: Check actual SYS architecture and record hashes
        shell: pwsh
        run: |
          $sys = Get-ChildItem drivers/apple-dockchannel/windows -Recurse -Filter AppleDockChannel.sys | Select-Object -First 1
          if (!$sys) { throw 'No linked SYS was produced' }
          $data = [IO.File]::ReadAllBytes($sys.FullName)
          $pe = [BitConverter]::ToUInt32($data, 60)
          if ([BitConverter]::ToUInt16($data, $pe + 4) -ne 0xAA64) { throw 'SYS is not ARM64' }
          if ([BitConverter]::ToUInt16($data, $pe + 92) -ne 1) { throw 'SYS is not a native driver' }
          $hashes = Get-ChildItem drivers/apple-dockchannel/windows -Recurse -File |
            Where-Object { $_.Extension -in '.sys', '.inf', '.cat', '.pdb' } |
            Get-FileHash -Algorithm SHA256
          @{ platform = 'j413'; hardware_qualified = $false; hashes = $hashes } |
            ConvertTo-Json -Depth 5 | Set-Content drivers/apple-dockchannel/windows/BUILD-IDENTITY.json
      - name: Upload software-only driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppleDockChannel-ARM64-Debug-unqualified
          if-no-files-found: error
          path: |
            drivers/apple-dockchannel/windows/ARM64/Debug/**/*.sys
            drivers/apple-dockchannel/windows/ARM64/Debug/**/*.inf
            drivers/apple-dockchannel/windows/ARM64/Debug/**/*.cat
            drivers/apple-dockchannel/windows/ARM64/Debug/**/*.pdb
            drivers/apple-dockchannel/windows/BUILD-IDENTITY.json
